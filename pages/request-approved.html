<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Alfred — Request approved</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #F4F6F8;
      font-family: Inter, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .wrap { width: 100%; max-width: 510px; }
    .logo { display: block; height: 34px; width: auto; max-width: 160px; margin: 0 0 14px 16px; }
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 32px;
      margin-bottom: 10px;
    }
    .status {
      margin: 0 0 20px;
      font-size: 22px;
      font-weight: 700;
      color: #16a34a;
      line-height: 1.3;
    }
    .bubble-row { display: flex; align-items: flex-start; gap: 0; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      display: block; flex-shrink: 0; margin-top: 4px;
    }
    .tail {
      width: 0; height: 0; margin-top: 14px; flex-shrink: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-right: 10px solid #f0e8ef;
    }
    .bubble {
      background: #f0e8ef;
      border-radius: 0 12px 12px 12px;
      padding: 14px 18px;
      flex: 1;
    }
    .bubble p {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      color: #1a1a1a;
    }
    .details h2 {
      margin: 0 0 16px;
      font-size: 17px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .row {
      display: flex;
      gap: 12px;
      padding-top: 8px;
      font-size: 14px;
    }
    .row:first-of-type { padding-top: 0; }
    .label { width: 40%; color: #888888; flex-shrink: 0; }
    .value { color: #1a1a1a; font-weight: 600; }
    .link-wrap { text-align: center; padding-top: 8px; }
    .link-wrap a {
      font-size: 14px;
      font-weight: 600;
      color: #6F2F6A;
      text-decoration: none;
    }
    .footer {
      background: #ffffff;
      border-radius: 14px;
      padding: 28px 40px;
      text-align: center;
    }
    .footer img { height: 36px; width: auto; display: block; margin: 0 auto 10px; }
    .footer .hotel { margin: 0 0 5px; font-size: 13px; font-weight: 700; color: #1a1a1a; }
    .footer .powered { margin: 0; font-size: 11px; color: #cccccc; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="https://paveltrnka-prog.github.io/alfred-emaily/assets/logo-pytloun.png" alt="Hotel Pytloun Liberec">

    <div class="card">
      <p class="status">Request approved</p>
      <div class="bubble-row">
        <img class="avatar" src="https://paveltrnka-prog.github.io/alfred-emaily/assets/alfred-avatar.svg" alt="Alfred">
        <div class="tail" aria-hidden="true"></div>
        <div class="bubble">
          <p>Early check-in for <strong>Jan Novák</strong> at <strong>11:00</strong> is approved. The guest will be asked to pay <strong>500&nbsp;CZK</strong>.</p>
        </div>
      </div>
    </div>

    <div class="card details">
      <h2>Request details</h2>
      <div class="row"><span class="label">Guest</span><span class="value">Jan Novák</span></div>
      <div class="row"><span class="label">Reservation no.</span><span class="value">20241471</span></div>
      <div class="row"><span class="label">Room</span><span class="value">204</span></div>
      <div class="row"><span class="label">Approved arrival</span><span class="value">11:00</span></div>
      <div class="row"><span class="label">Amount due</span><span class="value">500 CZK</span></div>
      <div class="link-wrap">
        <a href="https://app.previo.app/reservation/20241471">Open reservation in planner →</a>
      </div>
    </div>

    <div class="footer">
      <img src="https://paveltrnka-prog.github.io/alfred-emaily/assets/myalfred-logo.png" alt="myalfred">
      <p class="hotel">Hotel Pytloun Liberec</p>
      <p class="powered">Alfred powered by Previo</p>
    </div>
  </div>
</body>
</html>
